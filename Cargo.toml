[package]
name = "dasai-mochi-shin"
authors = ["Tachibana Shin"]
version = "0.1.0"
edition = "2021"
description = "Dasai Mochi Shin - ESP32-C3 firmware (Rust rewrite)"

[workspace]
# oled-i2c and sdmmc-fs are standalone workspaces with their own Cargo.lock;
# they are deliberately excluded here (not members) and pulled in via the path
# dependencies below.
members = []
exclude = ["crates/oled-i2c", "crates/sdmmc-fs"]
resolver = "2"

# ---------------------------------------------------------------------------
# ESP32-C3 chip + RTOS/HAL/radio stack.
#
# HƯỚNG A: to integrate the WiFi driver (`esp-radio`) with our esp-hal 1.2, the
# whole esp-rs stack (esp-hal, esp-radio, esp-rtos, esp-alloc, ...) is taken from
# the single esp-rs/esp-hal monorepo at ONE pinned git rev. All these crates live
# in that monorepo, so this keeps them mutually consistent (their versions match
# the crates.io releases currently in Cargo.lock: esp-hal 1.2.0, esp-rtos 0.4.0,
# esp-alloc 0.11, esp-storage 0.10.0, esp-radio-rtos-driver 0.4.1). Pinning the
# rev (instead of `branch = "main"`) makes the build reproducible.
# ---------------------------------------------------------------------------

[dependencies]
esp-backtrace = { git = "https://github.com/esp-rs/esp-hal.git", rev = "c9240a08b35cb6bfab7eff8cf336cb2797d07946", package = "esp-backtrace", version = "0.20", features = ["esp32c3", "panic-handler", "println"] }
esp-println = { git = "https://github.com/esp-rs/esp-hal.git", rev = "c9240a08b35cb6bfab7eff8cf336cb2797d07946", package = "esp-println", version = "0.18", default-features = false, features = ["esp32c3", "uart"] }
esp-hal = { git = "https://github.com/esp-rs/esp-hal.git", rev = "c9240a08b35cb6bfab7eff8cf336cb2797d07946", package = "esp-hal", version = "1.2.0", features = [
   "esp32c3",
   "unstable",
]}
esp-rtos = { git = "https://github.com/esp-rs/esp-hal.git", rev = "c9240a08b35cb6bfab7eff8cf336cb2797d07946", package = "esp-rtos", version = "0.4", features = ["embassy", "esp-alloc", "esp-radio", "esp32c3"] }
# WiFi / BLE / ESP-NOW radio driver (successor to esp-wifi). Requires esp-hal
# `unstable` and the esp-rtos `esp-radio` scheduler feature above.
esp-radio = { git = "https://github.com/esp-rs/esp-hal.git", rev = "c9240a08b35cb6bfab7eff8cf336cb2797d07946", package = "esp-radio", version = "1.0.0-beta.0", features = ["wifi", "esp32c3", "esp-alloc", "log-04", "unstable"] }
# TCP/IP stack over smoltcp, wired to the esp-radio device via embassy-net-driver.
embassy-net = { version = "0.9", features = ["dhcpv4", "medium-ethernet", "tcp", "dns", "udp"] }
embassy-futures = "0.1"
embedded-io-async = "0.7"
static_cell = "2.1"
log = { version = "0.4", default-features = false }
# Heap for the embassy executor / async tasks (provides the #[global_allocator]).
esp-alloc = { git = "https://github.com/esp-rs/esp-hal.git", rev = "c9240a08b35cb6bfab7eff8cf336cb2797d07946", package = "esp-alloc", version = "0.11", features = ["esp32c3"] }
# DHCP server on the provisioning SoftAP (so a phone gets an IP automatically),
# plus its edge-nal glue pair (edge-nal 0.7 / edge-nal-embassy 0.9 as used by the
# official esp-radio AP example).
edge-dhcp = "0.8.0"
edge-nal = "0.7.0"
edge-nal-embassy = "0.9.0"
embassy-executor    = { version = "0.10" }
embassy-sync              = { version = "0.8" }
embassy-time              = { version = "0.5" }
embassy-time-driver       = { version = "0.2", features = [ "tick-hz-1_000_000" ] }
smoltcp = { version = "0.12", default-features=false, features = [ "proto-ipv4", "socket-tcp", "socket-icmp", "socket-udp", "medium-ethernet", "proto-dhcpv4", "socket-raw", "socket-dhcpv4"] }
critical-section = "1.2"
esp-bootloader-esp-idf = { git = "https://github.com/esp-rs/esp-hal.git", rev = "c9240a08b35cb6bfab7eff8cf336cb2797d07946", package = "esp-bootloader-esp-idf", version = "0.6", features = ["esp32c3"]}

# SD card (FAT) filesystem reading over SPI
embedded-sdmmc = "0.9"
# Shared SPI bus -> SpiDevice bridge (for SD card + CS)
embedded-hal-bus = "0.3"
# Fixed-size collections (Vec, String) for no_std
heapless = "0.8"

# Shared I2C OLED display driver (SSD1306 / SH1106) as a local crate
oled-i2c = { path = "crates/oled-i2c" }

# Generic, path-based FAT filesystem convenience layer over embedded-sdmmc
sdmmc-fs = { path = "crates/sdmmc-fs" }
esp-storage = { git = "https://github.com/esp-rs/esp-hal.git", rev = "c9240a08b35cb6bfab7eff8cf336cb2797d07946", package = "esp-storage", version = "0.10.0", features = ["esp32c3"] }
