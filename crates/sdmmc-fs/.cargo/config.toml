# Standalone working config for sdmmc-fs.
#
# Cargo looks for config in the current directory first, then walks up to the
# parent directories. Without this file, running `cargo build` / `cargo test`
# inside crates/sdmmc-fs would pick up the *firmware* .cargo/config.toml
# (target = riscv32imc + build-std), which has no std and breaks host tests.
#
# Being a no_std library, the crate still compiles for bare-metal targets when
# you pass --target; this file only sets a sane default for local build/test.

[build]
# Native host target so `cargo build` and `cargo test` work out of the box.
# Override with `--target <triple>` when cross-compiling to a specific chip.
target = "x86_64-unknown-linux-gnu"
