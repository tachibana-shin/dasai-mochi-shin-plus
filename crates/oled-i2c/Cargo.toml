[package]
name = "oled-i2c"
version = "0.2.0"
edition = "2021"
rust-version = "1.81"
description = "Minimal no_std I2C OLED driver for SSD1306 / SH1106 controllers"
license = "MIT OR Apache-2.0"
readme = "README.md"
repository = "https://github.com/tachibana-shin/oled-i2c"
keywords = ["oled", "ssd1306", "sh1106", "i2c", "embedded", "no-std"]
categories = ["embedded", "hardware-support", "no-std"]

# This crate is a standalone workspace (no members): it deliberately opts out
# of any parent workspace so it keeps its own Cargo.lock and builds/tests in
# isolation. The firmware pins it via a path dependency instead.
[workspace]

[dependencies]
embedded-hal = "1.0.0"
embedded-graphics = { version = "0.8.2", optional = true }
# Fixed-capacity no_std collections for the runtime `.bdf` font loader.
heapless = "0.9.3"

[features]
default = []
# Implement `embedded_graphics::DrawTarget` for `Oled` (draw e-g primitives
# and fonts directly on the framebuffer).
embedded-graphics = ["dep:embedded-graphics"]

[lib]
# Always no_std: the driver only talks raw 1bpp page-major frame buffers.
